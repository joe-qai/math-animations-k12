<style>
.game-wrap { max-width:480px; margin:0 auto; padding:24px 0; }
.board-area { display:flex; justify-content:center; margin:16px 0; }
#board {
  display:grid; gap:4px; background:var(--line); border:2px solid var(--board-3);
  border-radius:6px; padding:4px; user-select:none; touch-action:manipulation;
}
.tile {
  aspect-ratio:1; border-radius:6px; font-weight:800; font-size:clamp(18px,5vw,28px);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  transition: transform .08s, box-shadow .08s; color:#fff;
}
.tile.empty { background:transparent !important; cursor:default; border:none; box-shadow:none; }
.tile:hover:not(.empty) { filter:brightness(1.15); transform:scale(1.03); }
.tile.correct { opacity:.65; }
.info { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; font-size:14px; color:var(--muted); flex-wrap:wrap; gap:8px; }
.btn-group { display:flex; gap:8px; justify-content:center; margin-top:12px; flex-wrap:wrap; }
.btn { padding:8px 16px; border-radius:6px; border:1.5px solid var(--line); background:var(--card); font-size:13px; font-weight:600; cursor:pointer; color:var(--ink); }
.btn:hover { border-color:var(--board-3); background:var(--paper-2); }
.btn-primary { background:var(--board); color:var(--chalk); border-color:var(--board); }
.btn-primary:hover { background:var(--board-2); }
.start-panel,.win-panel { text-align:center; padding:28px 16px; }
.size-btn { padding:10px 20px; border-radius:8px; border:1.5px solid var(--line); background:var(--card); font-size:14px; font-weight:600; cursor:pointer; color:var(--ink); transition:all .15s; }
.size-btn.active { border-color:var(--board-3); background:var(--board-3); color:var(--chalk); }
.win-icon { font-size:56px; margin-bottom:12px; }
.hint { font-size:12px; color:var(--muted); margin-top:8px; }
/* 颜色 */
.tile[data-val="1"]{background:#c98d22;}
.tile[data-val="2"]{background:#d4a032;}
.tile[data-val="3"]{background:#e8b84b;}
.tile[data-val="4"]{background:#3f7cbe;}
.tile[data-val="5"]{background:#5b9fd6;}
.tile[data-val="6"]{background:#7bb8e0;}
.tile[data-val="7"]{background:#2f8877;}
.tile[data-val="8"]{background:#4aad9a;}
.tile[data-val="9"]{background:#6fc494;}
.tile[data-val="10"]{background:#e8813a;}
.tile[data-val="11"]{background:#e06030;}
.tile[data-val="12"]{background:#d44020;}
.tile[data-val="13"]{background:#825aaa;}
.tile[data-val="14"]{background:#6a4090;}
.tile[data-val="15"]{background:#553070;}
.tile[data-val="16"]{background:#402060;}
.tile[data-val="17"]{background:#cc4433;}
.tile[data-val="18"]{background:#aa3322;}
.tile[data-val="19"]{background:#882211;}
.tile[data-val="20"]{background:#993344;}
.tile[data-val="21"]{background:#772233;}
.tile[data-val="22"]{background:#661122;}

.tile[data-val="24"]{background:#440000;}

<body>
<a class="skip" href="#main">跳到主要内容</a>
<header class="site-header"><div class="wrap nav"><a class="brand" href="../index.html"><span class="brand-mark">数</span><span>数益坊<small>K12 数学 · 动画课</small></span></a><nav class="nav-links"><a href="../index.html">首页</a><a href="index.html" aria-current="page">数学游戏</a></nav></div></header>
<main id="main"><div class="wrap game-wrap">
  <a href="index.html" style="color:var(--muted);font-size:13px;text-decoration:none;">← 返回游戏列表</a>
  <h1 style="margin:12px 0 4px;font-size:28px;">🏯 数字华容道</h1>
  <p style="color:var(--muted);margin:0 0 4px;">将数字按顺序排列：左上到右下依次是 1, 2, 3 … 最后一个格子留空。</p>
  <p class="hint">点击空格旁边的数字滑入空格，逐步拼好顺序</p>

  <div id="startPanel" class="start-panel">
    <p style="color:var(--muted);font-size:13px;margin-bottom:12px;">选择难度：</p>
    <div class="btn-group">
      <button class="size-btn active" data-n="3" onclick="pickSize(3)">3×3（简单）</button>
      <button class="size-btn" data-n="4" onclick="pickSize(4)">4×4（中等）</button>
      <button class="size-btn" data-n="5" onclick="pickSize(5)">5×5（困难）</button>
    </div>
    <button class="btn btn-primary" onclick="startGame()" style="margin-top:16px;">开始游戏</button>
  </div>

  <div id="gamePanel" style="display:none;">
    <div class="info">
      <span>步数：<strong id="moveCnt">0</strong></span>
      <span id="sizeLabel">3×3</span>
      <span>已完成：<strong id="correctCnt">0</strong>/<strong id="totalTiles">8</strong></span>
    </div>
    <div class="board-area"><div id="board"></div></div>
    <div class="btn-group">
      <button class="btn" onclick="resetGame()">重置</button>
      <button class="btn" onclick="shuffleBoard()">打乱重来</button>
      <a href="index.html" class="btn">返回列表</a>
    </div>
  </div>

  <div id="winPanel" style="display:none;" class="win-panel">
    <div class="win-icon">🎊</div>
    <h2 style="margin:0 0 8px;">恭喜通关！</h2>
    <p style="color:var(--muted);" id="winMsg"></p>
    <button class="btn btn-primary" onclick="resetGame()" style="margin-top:16px;">再来一局</button>
  </div>
</div></main>
<footer class="site-footer"><div class="wrap"><div class="footer-base"><span>© 数益坊 · 数字华容道</span></div></div></footer>

<script>
let size=3, board=[], moves=0, won=false;

function pickSize(n){
  size=n;
  document.querySelectorAll('.size-btn').forEach(b=>b.classList.toggle('active',parseInt(b.dataset.n)===n));
}

// 判断是否完成
function isSolved(){
  const total=size*size;
  for(let i=0;i<total-1;i++) if(board[i]!==i+1) return false;
  return board[total-1]===0;
}

// 初始化完成态
function initSolved(){
  board=[];
  for(let i=1;i<size*size;i++) board.push(i);
  board.push(0);
}

// 随机打乱（模拟合法移动保证有解）
function shuffle(){
  initSolved();
  let emptyIdx=size*size-1;
  const numShuffles=size*60;
  for(let k=0;k<numShuffles;k++){
    const nb=getNeighbors(emptyIdx);
    const pick=nb[Math.floor(Math.random()*nb.length)];
    [board[emptyIdx],board[pick]]=[board[pick],board[emptyIdx]];
    emptyIdx=pick;
  }
  if(isSolved()) shuffle();
}

function getNeighbors(idx){
  const r=Math.floor(idx/size), c=idx%size;
  const nb=[];
  if(r>0)nb.push(idx-size);
  if(r<size-1)nb.push(idx+size);
  if(c>0)nb.push(idx-1);
  if(c<size-1)nb.push(idx+1);
  return nb;
}

// 渲染棋盘
function render(){
  const el=document.getElementById('board');
  const cellSize=Math.min(Math.floor((window.innerWidth-64)/size), Math.floor((window.innerHeight-280)/size), 72);
  el.style.gridTemplateColumns='repeat('+size+','+cellSize+'px)';
  el.style.gridTemplateRows='repeat('+size+','+cellSize+'px)';
  el.innerHTML='';
  let correctCount=0;
  for(let i=0;i<board.length;i++){
    const v=board[i];
    const div=document.createElement('div');
    div.className='tile' + (v===0?' empty':'');
    if(v!==0){
      div.textContent=v;
      div.setAttribute('data-val',v);
      if(v===i+1) div.classList.add('correct');
      // 点击：如果这个格子和空格相邻，就移过去
      if(getNeighbors(i).indexOf(board.indexOf(0))>=0){
        div.addEventListener('click',function(){ moveTile(i); });
      }else{
        div.style.opacity='0.6';
        div.style.cursor='default';
      }
    }
    el.appendChild(div);
  }
  for(let i=0;i<board.length-1;i++) if(board[i]===i+1) correctCount++;
  document.getElementById('correctCnt').textContent=correctCount;
  document.getElementById('totalTiles').textContent=board.length-1;
}

// 移动目标格到空格位置
function moveTile(idx){
  if(won)return;
  const z=board.indexOf(0);
  if(!getNeighbors(z).indexOf(idx)>=0)return; // 不相邻则忽略
  // 修正：上面这行逻辑有误，改用直接的邻居检查
  const nbrs=getNeighbors(z);
  if(nbrs.indexOf(idx)<0)return;
  [board[idx],board[z]]=[board[z],board[idx]];
  moves++;
  document.getElementById('moveCnt').textContent=moves;
  render();
  if(isSolved()) win();
}

// 键盘：方向键推动对应方向的数字向空格移动
document.addEventListener('keydown',e=>{
  if(won)return;
  e.preventDefault();
  const z=board.indexOf(0);
  const r=Math.floor(z/size), c=z%size;
  // 根据空格位置决定哪些数字可以被推动
  // 向上推 = 空格上方的数字向下移动到空格
  // 向下推 = 空格下方的数字向上移动到空格
  // 向左推 = 空格左边的数字向右移动到空格
  // 向右推 = 空格右边的数字向左移动到空格
  let target=-1;
  if(e.key==='ArrowUp'&&r<size-1) target=z+size;       // 下方数字上移
  if(e.key==='ArrowDown'&&r>0)   target=z-size;        // 上方数字下移
  if(e.key==='ArrowLeft'&&c<size-1) target=z+1;        // 右方数字左移
  if(e.key==='ArrowRight'&&c>0)  target=z-1;           // 左方数字右移
  if(target>=0) moveTile(target);
});

function startGame(){
  document.getElementById('startPanel').style.display='none';
  document.getElementById('gamePanel').style.display='block';
  document.getElementById('winPanel').style.display='none';
  document.getElementById('sizeLabel').textContent=size+'×'+size;
  moves=0;won=false;
  document.getElementById('moveCnt').textContent=0;
  shuffle();
  render();
}

function resetGame(){ startGame(); }
function shuffleBoard(){ startGame(); }

function win(){
  won=true;
  setTimeout(()=>{
    document.getElementById('gamePanel').style.display='none';
    document.getElementById('winPanel').style.display='block';
    document.getElementById('winMsg').textContent='共 '+moves+' 步完成 · '+size+'×'+size+' 棋局';
  },200);
}
</script>
</body>
