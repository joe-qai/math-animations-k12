<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>竖式运算 — 动画演示</title>
  <style>
    :root {
      --bg: #0f1117; --card: #1a1d27; --accent: #6c5ce7;
      --accent2: #00cec9; --text: #e8e8f0; --muted: #6b7280;
      --warm: #fd79a8; --success: #00b894; --warn: #fdcb6e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'PingFang SC','Microsoft YaHei',sans-serif; min-height: 100vh; padding: 24px; }
    a.back { color: var(--muted); text-decoration: none; font-size: 0.9rem; display: inline-block; margin-bottom: 20px; }
    a.back:hover { color: var(--accent); }
    h1 { font-size: 1.6rem; margin-bottom: 6px; }
    .subtitle { color: var(--muted); font-size: 0.95rem; margin-bottom: 28px; }

    .controls { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
    .controls label { color: var(--muted); font-size: 0.9rem; }
    .controls select, .controls input {
      background: var(--card); color: var(--text); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; padding: 6px 12px; font-size: 0.9rem;
    }
    .btn { padding: 8px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 0.9rem; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: rgba(255,255,255,0.08); color: var(--text); }

    .panel { background: var(--card); border-radius: 16px; padding: 32px; border: 1px solid rgba(255,255,255,0.06); }

    /* Chinese description badge */
    .desc-badge {
      display: inline-flex; align-items: flex-start; gap: 10px;
      background: rgba(0,206,201,0.08); border: 1px solid rgba(0,206,201,0.25);
      border-radius: 10px; padding: 12px 18px; margin-bottom: 20px;
      font-size: 0.88rem; color: var(--accent2); line-height: 1.7;
    }
    .desc-badge .badge-icon { font-size: 1.2rem; flex-shrink: 0; margin-top: 2px; }
    .desc-badge strong { color: var(--warn); }

    /* Vertical calc */
    .calc-container { display: flex; flex-direction: column; align-items: center; gap: 20px; }
    .calc-display {
      display: grid; gap: 4px;
      font-family: 'Courier New', monospace;
    }
    .calc-row {
      display: grid; gap: 4px;
    }
    .calc-cell {
      width: 56px; height: 60px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; font-weight: 700;
      border-radius: 8px; transition: all 0.3s; position: relative;
    }
    .calc-cell.empty { background: transparent; }
    .calc-cell.num { background: rgba(255,255,255,0.04); color: var(--text); }
    .calc-cell.op { color: var(--muted); font-size: 1.2rem; }
    .calc-cell.result { color: var(--success); }
    .calc-cell.active {
      background: var(--accent); color: #fff;
      box-shadow: 0 0 20px rgba(108,92,231,0.5);
      transform: scale(1.1);
    }
    .calc-cell.carry { color: var(--warn); font-size: 0.9rem; position: absolute; top: 2px; right: 4px; }
    .calc-cell.borrow { color: var(--warm); font-size: 0.9rem; position: absolute; top: 2px; right: 4px; }
    .calc-line { grid-column: 1 / -1; height: 2px; background: rgba(255,255,255,0.2); border-radius: 1px; }

    /* Step explanation */
    .calc-explain {
      min-height: 56px; padding: 14px 20px;
      background: rgba(108,92,231,0.08); border-radius: 10px;
      color: var(--accent2); font-size: 0.95rem; text-align: center;
      border: 1px solid rgba(108,92,231,0.2); line-height: 1.6;
    }

    /* Demo selector */
    .demo-list { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .demo-btn {
      padding: 6px 14px; border-radius: 20px;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      color: var(--muted); cursor: pointer; font-size: 0.85rem; transition: all 0.2s;
    }
    .demo-btn.active { background: var(--accent2); color: #fff; border-color: var(--accent2); }
    .demo-btn:hover:not(.active) { border-color: var(--accent2); color: var(--text); }
    .demo-btn .demo-desc { font-size: 0.72rem; opacity: 0.7; display: block; margin-top: 1px; }

    /* Step log */
    .step-log {
      margin-top: 16px; padding: 12px 16px;
      background: rgba(255,255,255,0.03); border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.06);
      max-height: 160px; overflow-y: auto;
      font-size: 0.84rem; color: var(--muted); line-height: 1.8;
    }
    .step-log .step-entry { padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .step-log .step-entry:last-child { border-bottom: none; }
    .step-log .step-num { color: var(--accent); font-weight: 600; margin-right: 6px; }
  </style>
</head>
<body>
  <a class="back" href="../index.html">← 返回首页</a>
  <h1>＋ 竖式运算动画</h1>
  <p class="subtitle">进位不是死记的规则，是"10个一换1个十"的自然结果。看动画理解每一步。</p>

  <!-- 四种演示场景 -->
  <div class="demo-list">
    <button class="demo-btn active" data-demo="add1">
      加法：进位
      <span class="demo-desc">276 + 185，一位进位</span>
    </button>
    <button class="demo-btn" data-demo="add2">
      加法：多次进位
      <span class="demo-desc">999 + 111，连续进位</span>
    </button>
    <button class="demo-btn" data-demo="sub1">
      减法：借位
      <span class="demo-desc">503 − 187，中间为零</span>
    </button>
    <button class="demo-btn" data-demo="sub2">
      减法：连续借位
      <span class="demo-desc">3000 − 1785，多连借</span>
    </button>
  </div>

  <div class="panel">
    <div class="calc-container">
      <div class="desc-badge" id="descBadge">
        <span class="badge-icon">💡</span>
        <div>
          <strong>什么是进位？</strong><br>
          当个位相加满 10 时，不能写在个位，必须把它"换"成十位上的 1。<br>
          就像 <strong>10 枚 1 元硬币 = 1 张 10 元纸币</strong>，数量没变，只是换了单位。
        </div>
      </div>

      <div class="controls">
        <button class="btn btn-primary" id="playBtn">▶ 自动播放</button>
        <button class="btn btn-secondary" id="stepBtn">⏭ 单步前进</button>
        <button class="btn btn-secondary" id="resetBtn">↺ 重置</button>
        <label><input type="checkbox" id="soundCheck" checked> 音效</label>
      </div>

      <div class="calc-display" id="calcDisplay"></div>
      <div class="calc-explain" id="calcExplain">选择算式，点击"自动播放"或"单步前进"开始动画</div>
      <div class="step-log" id="stepLog">
        <div class="step-entry">就绪：从个位开始逐位计算，动画会告诉你每一步在做什么</div>
      </div>
    </div>
  </div>

<script>
// ========== AUDIO ==========
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function ensureAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }
function playNote(freq, dur=0.12, vol=0.1) {
  if (!document.getElementById('soundCheck').checked) return;
  ensureAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine'; osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + dur);
}
const NOTE_C = [262,294,330,349,392,440,494,523];

// ========== STATE ==========
let currentDemo = 'add1';
let currentStep = 0;
let animating = false;
let autoTimer = null;

// ========== RENDER ==========
function renderCalc(demo) {
  const display = document.getElementById('calcDisplay');
  display.innerHTML = '';
  const maxLen = Math.max(demo.a.length, demo.b.length) + 1;

  // Set up grid layout
  display.style.display = 'flex';
  display.style.flexDirection = 'column';
  display.style.alignItems = 'center';
  display.style.gap = '4px';

  // Row 0: marker cells (carry/borrow)
  const row0 = document.createElement('div');
  row0.className = 'calc-row';
  row0.style.gridTemplateColumns = `repeat(${maxLen}, 56px)`;
  row0.style.gap = '4px';
  for (let i = 0; i < maxLen; i++) {
    const cell = document.createElement('div');
    cell.className = 'calc-cell empty';
    cell.dataset.type = 'marker';
    cell.dataset.col = i;
    row0.appendChild(cell);
  }
  display.appendChild(row0);

  // Row 1: first number
  const row1 = document.createElement('div');
  row1.className = 'calc-row';
  row1.style.gridTemplateColumns = `repeat(${maxLen}, 56px)`;
  row1.style.gap = '4px';
  for (let i = 0; i < maxLen; i++) {
    const idx = demo.a.length - 1 - i;
    const cell = document.createElement('div');
    cell.className = 'calc-cell num';
    cell.dataset.row = '1';
    cell.dataset.col = i;
    cell.textContent = idx >= 0 ? demo.a[idx] : '';
    row1.appendChild(cell);
  }
  display.appendChild(row1);

  // Row 2: operator + second number
  const row2 = document.createElement('div');
  row2.className = 'calc-row';
  row2.style.gridTemplateColumns = `repeat(${maxLen}, 56px)`;
  row2.style.gap = '4px';
  for (let i = 0; i < maxLen; i++) {
    const idx = demo.b.length - 1 - i;
    const cell = document.createElement('div');
    if (i === maxLen - 1) {
      cell.className = 'calc-cell op';
      cell.textContent = demo.op;
    } else {
      cell.className = 'calc-cell num';
      cell.dataset.row = '2';
      cell.dataset.col = i;
      cell.textContent = idx >= 0 ? demo.b[idx] : '';
    }
    row2.appendChild(cell);
  }
  display.appendChild(row2);

  // Row 3: separator line
  const line = document.createElement('div');
  line.className = 'calc-line';
  line.style.width = `${maxLen * 60}px`;
  display.appendChild(line);

  // Row 4: result
  const row4 = document.createElement('div');
  row4.className = 'calc-row';
  row4.style.gridTemplateColumns = `repeat(${maxLen}, 56px)`;
  row4.style.gap = '4px';
  for (let i = 0; i < maxLen; i++) {
    const cell = document.createElement('div');
    cell.className = 'calc-cell result';
    cell.dataset.type = 'result';
    cell.dataset.col = i;
    cell.textContent = '';
    row4.appendChild(cell);
  }
  display.appendChild(row4);
}

function getResultCell(col) {
  return document.querySelector(`.calc-cell[data-type="result"][data-col="${col}"]`);
}
function getMarkerCell(col) {
  return document.querySelector(`.calc-cell[data-type="marker"][data-col="${col}"]`);
}

function runStep(demo, stepIdx) {
  const step = demo.steps[stepIdx];
  const explain = document.getElementById('calcExplain');
  explain.innerHTML = step.explain;

  // Add to log
  const log = document.getElementById('stepLog');
  const div = document.createElement('div');
  div.className = 'step-entry';
  div.innerHTML = `<span class="step-num">步骤${stepIdx + 1}：</span>${step.log}`;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;

  // Clear highlights
  document.querySelectorAll('.calc-cell').forEach(c => {
    c.classList.remove('active');
    const mark = c.querySelector('.carry, .borrow');
    if (mark) mark.remove();
  });

  // Set result digits progressively
  const resultStr = String(parseInt(demo.a.join('')) + (demo.op === '+' ? parseInt(demo.b.join('')) : -parseInt(demo.b.join(''))));
  const maxLen = Math.max(demo.a.length, demo.b.length) + 1;

  // Determine which result digits to show based on step
  if (step.cells.length > 0) {
    const lastIdx = step.cells[step.cells.length - 1];
    const resultCell = getResultCell(maxLen - 1 - lastIdx);
    if (resultCell) {
      const digitPos = resultStr.length - 1 - lastIdx;
      if (digitPos >= 0 && digitPos < resultStr.length) {
        resultCell.textContent = resultStr[digitPos];
        resultCell.classList.add('active');
        playNote(NOTE_C[lastIdx % 8], 0.15, 0.1);
      }
    }
  }

  // Show carry/borrow markers
  if (step.carry) {
    const marker = getMarkerCell(maxLen - 1 - step.carry.col);
    if (marker) marker.innerHTML = `<span class="carry">${step.carry.val}</span>`;
  }
  if (step.borrow) {
    const marker = getMarkerCell(maxLen - 1 - step.borrow.col);
    if (marker) marker.innerHTML = `<span class="borrow">${step.borrow.val}</span>`;
  }
}

function playAuto() {
  if (animating) return;
  animating = true;
  const demo = DEMOS[currentDemo];
  currentStep = 0;
  runStep(demo, 0);
  autoTimer = setInterval(() => {
    currentStep++;
    if (currentStep >= demo.steps.length) {
      clearInterval(autoTimer);
      animating = false;
      document.getElementById('calcExplain').innerHTML += '<br><span style="color:var(--success)">✓ 动画结束，可以重置重新观看</span>';
      return;
    }
    runStep(demo, currentStep);
  }, 2500);
}

function stepForward() {
  if (animating) return;
  const demo = DEMOS[currentDemo];
  if (currentStep < demo.steps.length) {
    runStep(demo, currentStep);
    currentStep++;
  }
}

function resetCalc() {
  clearInterval(autoTimer);
  animating = false;
  currentStep = 0;
  renderCalc(DEMOS[currentDemo]);
  document.getElementById('calcExplain').textContent = '点击"自动播放"或"单步前进"开始动画';
  document.getElementById('stepLog').innerHTML = '<div class="step-entry">已重置，随时可以重新播放</div>';
}

// ========== EVENT LISTENERS ==========
document.getElementById('playBtn').addEventListener('click', playAuto);
document.getElementById('stepBtn').addEventListener('click', stepForward);
document.getElementById('resetBtn').addEventListener('click', resetCalc);

document.querySelectorAll('.demo-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.demo-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentDemo = btn.dataset.demo;
    // Update badge
    document.getElementById('descBadge').innerHTML =
      `<span class="badge-icon">💡</span><div>${DEMOS[currentDemo].badge}</div>`;
    resetCalc();
  });
});

// Init
renderCalc(DEMOS[currentDemo]);
</script>
</body>
</html>
