<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>面积公式 — 割补变换动画</title>
  <style>
    :root {
      --bg: #0f1117; --card: #1a1d27; --accent: #6c5ce7;
      --accent2: #00cec9; --text: #e8e8f0; --muted: #6b7280;
      --warm: #fd79a8; --success: #00b894; --warn: #fdcb6e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'PingFang SC','Microsoft YaHei',sans-serif; min-height: 100vh; padding: 24px; }
    a.back { color: var(--muted); text-decoration: none; font-size: 0.9rem; display: inline-block; margin-bottom: 20px; }
    a.back:hover { color: var(--accent); }
    h1 { font-size: 1.6rem; margin-bottom: 6px; }
    .subtitle { color: var(--muted); font-size: 0.95rem; margin-bottom: 28px; }
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
    .mode-tab {
      padding: 8px 20px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1);
      background: transparent; color: var(--muted); cursor: pointer;
      font-size: 0.9rem; transition: all 0.2s;
    }
    .mode-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .mode-tab:hover:not(.active) { border-color: var(--accent); color: var(--text); }
    .mode-tab .tab-desc { font-size: 0.75rem; opacity: 0.7; display: block; margin-top: 2px; }
    .panel { background: var(--card); border-radius: 16px; padding: 32px; border: 1px solid rgba(255,255,255,0.06); }
    canvas { border-radius: 12px; display: block; margin: 0 auto; }
    .explain { min-height: 56px; padding: 14px 20px; margin-top: 16px; background: rgba(108,92,231,0.08); border-radius: 10px; color: var(--accent2); font-size: 0.95rem; text-align: center; border: 1px solid rgba(108,92,231,0.2); line-height: 1.6; }
    .formula { font-size: 1.4rem; font-weight: 700; color: var(--warn); text-align: center; margin-top: 12px; font-family: 'Courier New', monospace; }
    .desc-badge {
      display: inline-flex; align-items: flex-start; gap: 10px;
      background: rgba(108,92,231,0.08); border: 1px solid rgba(108,92,231,0.25);
      border-radius: 10px; padding: 12px 18px; margin-bottom: 20px;
      font-size: 0.88rem; color: var(--accent2); line-height: 1.7;
    }
    .desc-badge .badge-icon { font-size: 1.2rem; flex-shrink: 0; margin-top: 2px; }
    .desc-badge strong { color: var(--warn); }
    .step-log {
      margin-top: 12px; padding: 12px 16px;
      background: rgba(255,255,255,0.03); border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.06);
      max-height: 150px; overflow-y: auto;
      font-size: 0.84rem; color: var(--muted); line-height: 1.8;
    }
    .step-log .step-entry { padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .step-log .step-entry:last-child { border-bottom: none; }
    .step-log .step-num { color: var(--accent); font-weight: 600; margin-right: 6px; }
    .controls { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
    .btn { padding: 8px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 0.9rem; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: rgba(255,255,255,0.08); color: var(--text); }
  </style>
</head>
<body>
  <a class="back" href="../index.html">← 返回首页</a>
  <h1>▭ 面积公式</h1>
  <p class="subtitle">公式不是背出来的，是拼出来的。看图形如何通过割补变换变成另一种形状。</p>

  <div class="mode-tabs">
    <button class="mode-tab active" data-mode="rect">
      长方形面积
      <span class="tab-desc">格子计数 → 公式</span>
    </button>
    <button class="mode-tab" data-mode="triangle">
      三角形面积
      <span class="tab-desc">割补 → 变成长方形</span>
    </button>
    <button class="mode-tab" data-mode="parallel">
      平行四边形面积
      <span class="tab-desc">剪拼 → 变成用长方形</span>
    </button>
  </div>

  <div class="panel">
    <div class="desc-badge" id="descBadge">
      <span class="badge-icon">📐</span>
      <div>
        <strong>核心思想：面积守恒</strong><br>
        把图形剪开、移动、重新拼接，形状变了，但<strong>总面积不变</strong>。<br>
        这就是为什么公式可以这样推导——不是凭空来的，是从图形拼出来的。
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="playBtn">▶ 播放动画</button>
      <button class="btn btn-secondary" id="resetBtn">↺ 重置</button>
    </div>

    <canvas id="canvas" width="600" height="400"></canvas>
    <div class="explain" id="explain">选择一种图形，点击播放观察面积公式如何产生</div>
    <div class="formula" id="formula"></div>
    <div class="step-log" id="stepLog">
      <div class="step-entry">就绪：选择图形并点击播放，逐步理解公式来源</div>
    </div>
  </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let animId = null;
let currentMode = 'rect';
let animProgress = 0;

function resize() {
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * 2;
  canvas.height = 800;
  ctx.scale(2, 2);
}
resize();
window.addEventListener('resize', () => { resize(); redraw(); });

function clear() { ctx.clearRect(0, 0, canvas.offsetWidth, 400); }

function addLog(log, title, desc) {
  const div = document.createElement('div');
  div.className = 'step-entry';
  div.innerHTML = `<span class="step-num">[${title}]</span>${desc}`;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

// ===== RECTANGLE =====
function drawRect(t) {
  clear();
  const W = canvas.offsetWidth, H = 400;
  const cols = 5, rows = 3;
  const cellW = 50, cellH = 40;
  const startX = (W - cols * cellW) / 2;
  const startY = (H - rows * cellH) / 2;

  const log = document.getElementById('stepLog');

  if (t === 0) {
    // Initial: empty grid outline
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4,4]);
    ctx.strokeRect(startX, startY, cols*cellW, rows*cellH);
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.font = '14px PingFang SC';
    ctx.textAlign = 'center';
    ctx.fillText('这是一个 5 列 × 3 行的网格', W/2, startY + rows*cellH + 30);
    document.getElementById('explain').textContent = '一个 5×3 的空白网格，还没有填充';
    document.getElementById('formula').textContent = '';
    return;
  }

  // Phase 1 (0-0.5): cells appear one by one
  // Phase 2 (0.5-0.8): show dimensions
  // Phase 3 (0.8-1.0): show formula

  const fillProgress = Math.min(t / 0.5, 1);
  let count = Math.floor(fillProgress * cols * rows);

  // Draw filled cells
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const idx = r * cols + c;
      if (idx >= count) continue;
      const x = startX + c * cellW;
      const y = startY + r * cellH;
      const cellT = idx === count - 1 ? (fillProgress * cols * rows) - count : 1;

      ctx.fillStyle = `rgba(108, 92, 231, ${0.25 + cellT * 0.35})`;
      ctx.fillRect(x + 2, y + 2, cellW - 4, cellH - 4);
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 2, y + 2, cellW - 4, cellH - 4);
    }
  }

  // Grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.lineWidth = 1;
  for (let r = 0; r <= rows; r++) {
    ctx.beginPath();
    ctx.moveTo(startX, startY + r * cellH);
    ctx.lineTo(startX + cols * cellW, startY + r * cellH);
    ctx.stroke();
  }
  for (let c = 0; c <= cols; c++) {
    ctx.beginPath();
    ctx.moveTo(startX + c * cellW, startY);
    ctx.lineTo(startX + c * cellW, startY + rows * cellH);
    ctx.stroke();
  }

  // Phase 2: show dimensions
  if (t > 0.5) {
    const dimT = Math.min((t - 0.5) / 0.2, 1);
    ctx.fillStyle = `rgba(253,203,110,${dimT})`;
    ctx.font = 'bold 14px PingFang SC';
    ctx.textAlign = 'center';
    ctx.fillText(`长 = ${cols} 个单位`, startX + cols*cellW/2, startY + rows*cellH + 24);

    ctx.save();
    ctx.translate(startX - 22, startY + rows*cellH/2);
    ctx.rotate(-Math.PI/2);
    ctx.fillText(`宽 = ${rows} 个单位`, 0, 0);
    ctx.restore();
  }

  // Phase 3: formula
  if (t > 0.8) {
    const fT = Math.min((t - 0.8) / 0.2, 1);
    const total = cols * rows;
    ctx.fillStyle = `rgba(0,184,148,${fT})`;
    ctx.font = 'bold 15px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(`${cols} × ${rows} = ${total} 个小方格`, W/2, startY - 20);
  }

  if (t >= 1) {
    document.getElementById('explain').innerHTML =
      `一共有 <strong>${cols} × ${rows} = ${cols*rows}</strong> 个小方格，每个面积是 1，总面积就是 <strong>长 × 宽</strong><br>` +
      `公式：S = 长 × 宽，来源于格子计数，不是凭空规定`;
    document.getElementById('formula').textContent = 'S = 长 × 宽';
    if (log.innerHTML.includes('完成') === false) {
      addLog(log, '完成', `长方形面积 = 长 × 宽 = ${cols} × ${rows} = ${cols*rows} 平方单位`);
    }
  }
}

// ===== TRIANGLE =====
function drawTriangle(t) {
  clear();
  const W = canvas.offsetWidth, H = 400;
  const base = 200, height = 200;
  const startX = (W - base) / 2;
  const startY = H - 60;
  const midX = startX + base / 2;
  const topY = startY - height;
  const log = document.getElementById('stepLog');

  const phase = t < 0.3 ? 0 : t < 0.6 ? 1 : 2;
  const pt = phase === 0 ? t/0.3 : phase === 1 ? (t-0.3)/0.3 : (t-0.6)/0.4;

  if (phase === 0) {
    // Draw full triangle
    ctx.fillStyle = 'rgba(0, 206, 201, 0.25)';
    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.lineTo(midX, topY);
    ctx.lineTo(startX + base, startY);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#00cec9';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Grid lines inside
    const levels = 5;
    for (let i = 1; i < levels; i++) {
      const frac = i / levels;
      const y = startY - height * frac;
      const halfW = base/2 * (1 - frac);
      ctx.strokeStyle = 'rgba(255,255,255,0.1)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(midX - halfW, y);
      ctx.lineTo(midX + halfW, y);
      ctx.stroke();
    }

    // Center dashed line (fold line)
    ctx.setLineDash([6,4]);
    ctx.strokeStyle = '#fd79a8';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(midX, topY);
    ctx.lineTo(midX, startY);
    ctx.stroke();
    ctx.setLineDash([]);

    // Labels
    ctx.fillStyle = '#fdcb6e';
    ctx.font = 'bold 14px PingFang SC';
    ctx.textAlign = 'center';
    ctx.fillText(`底 = ${base}`, startX + base/2, startY + 28);

    ctx.save();
    ctx.translate(startX - 22, startY - height/2);
    ctx.rotate(-Math.PI/2);
    ctx.fillText(`高 = ${height}`, 0, 0);
    ctx.restore();

    document.getElementById('explain').innerHTML =
      `三角形底为 <strong>${base}</strong>，高为 <strong>${height}</strong>。<br>` +
      `虚线是中线，将三角形分成左右两个全等部分，准备剪开重组。`;
    document.getElementById('formula').textContent = '';
    if (pt > 0.8 && !log.innerHTML.includes('中线')) {
      addLog(log, '观察', `三角形被中线分成左右两半，每半底=${base/2}，高=${height}`);
    }
  }
  else if (phase === 1) {
    // Left half stays, right half moves right
    const moveX = pt * base / 2;

    // Left half (stays)
    ctx.fillStyle = 'rgba(108, 92, 231, 0.3)';
    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.lineTo(midX, topY);
    ctx.lineTo(midX, startY);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#6c5ce7';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Right half (moving right and flipping)
    ctx.fillStyle = 'rgba(253, 121, 168, 0.3)';
    ctx.beginPath();
    ctx.moveTo(midX + moveX, startY);
    ctx.lineTo(midX + moveX, topY);
    ctx.lineTo(startX + base + moveX, startY);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#fd79a8';
    ctx.stroke();

    // Movement arrow
    ctx.fillStyle = '#fd79a8';
    ctx.font = '13px PingFang SC';
    ctx.textAlign = 'center';
    ctx.fillText('→ 平移 →', midX + base/2, topY - 20);

    document.getElementById('explain').innerHTML =
      `把右半三角形沿中线剪下，水平平移到左侧下方。<br>` +
      `移动过程中图形不变形，<strong>面积保持不变</strong>。`;
    document.getElementById('formula').textContent = '';
    if (pt > 0.5 && !log.innerHTML.includes('平移')) {
      addLog(log, '平移', '右半三角形向右平移，与左半三角形拼合');
    }
  }
  else {
    // Rectangle formed
    const rectH = height / 2;
    const rx = startX;
    const ry = startY - rectH;

    // Full rectangle
    ctx.fillStyle = 'rgba(108, 92, 231, 0.25)';
    ctx.fillRect(rx, ry, base, height);
    ctx.strokeStyle = '#6c5ce7';
    ctx.lineWidth = 2;
    ctx.strokeRect(rx, ry, base, ry + height);

    // Show the two triangles
    ctx.setLineDash([4,4]);
    ctx.strokeStyle = 'rgba(253,121,168,0.4)';
    ctx.beginPath();
    ctx.moveTo(rx + base, ry);
    ctx.lineTo(rx, ry + height);
    ctx.stroke();
    ctx.setLineDash([]);

    // Labels
    ctx.fillStyle = '#fdcb6e';
    ctx.font = 'bold 14px PingFang SC';
    ctx.textAlign = 'center';
    ctx.fillText(`底 = ${base}`, rx + base/2, ry + height + 28);
    ctx.save();
    ctx.translate(rx - 28, ry + height/2);
    ctx.rotate(-Math.PI/2);
    ctx.fillText(`高/2 = ${height/2}`, 0, 0);
    ctx.restore();

    // Formula
    const area = base * rectH;
    ctx.fillStyle = 'rgba(0,184,148,0.9)';
    ctx.font = 'bold 14px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(`${base} × ${rectH} = ${area} 平方单位`, W/2, ry - 20);

    document.getElementById('explain').innerHTML =
      `两个全等三角形拼成一个长方形！<br>` +
      `长方形面积 = ${base} × ${rectH} = ${area}<br>` +
      `所以三角形面积 = 长方形面积 ÷ 2 = <strong>${base} × ${height} ÷ 2 = ${area}</strong>`;
    document.getElementById('formula').textContent = 'S = 底 × 高 ÷ 2';
    addLog(log, '完成', `三角形面积 = ${base} × ${height} ÷ 2 = ${area}，割补不改变面积`);
  }
}

// ===== PARALLELOGRAM =====
function drawParallelogram(t) {
  clear();
  const W = canvas.offsetWidth, H = 400;
  const base = 220, height = 180, skew = 60;
  const startX = (W - base - skew) / 2;
  const startY = H - 60;
  const log = document.getElementById('stepLog');

  const phase = t < 0.35 ? 0 : t < 0.7 ? 1 : 2;
  const pt = phase === 0 ? t/0.35 : phase === 1 ? (t-0.35)/0.35 : (t-0.7)/0.3;

  if (phase === 0) {
    // Fill parallelogram
    ctx.fillStyle = 'rgba(108, 92, 231, 0.25)';
    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.lineTo(startX + skew, startY - height);
    ctx.lineTo(startX + skew + base, startY - height);
    ctx.lineTo(startX + base, startY);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#6c5ce7';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Height indicator
    ctx.strokeStyle = '#fdcb6e';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(startX + skew, startY);
    ctx.lineTo(startX + skew, startY - height);
    ctx.stroke();

    // Right angle marker
    ctx.strokeStyle = 'rgba(253,203,110,0.6)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(startX + skew, startY - 14);
    ctx.lineTo(startX + skew + 14, startY - 14);
    ctx.lineTo(startX + skew + 14, startY);
    ctx.stroke();

    // Base label
    ctx.fillStyle = '#fdcb6e';
    ctx.font = 'bold 14px PingFang SC';
    ctx.textAlign = 'center';
    ctx.fillText(`底 = ${base}`, startX + base/2 + skew/2, startY + 28);

    // Height label
    ctx.save();
    ctx.translate(startX + skew + 22, startY - height/2);
    ctx.fillText(`高 = ${height}`, 0, 0);
    ctx.restore();

    // Cut line (left triangle)
    ctx.setLineDash([6,4]);
    ctx.strokeStyle = '#fd79a8';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.lineTo(startX + skew, startY - height);
    ctx.stroke();
    ctx.setLineDash([]);

    document.getElementById('explain').innerHTML =
      `平行四边形底为 <strong>${base}</strong>，高为 <strong>${height}</strong>。<br>` +
      `沿高剪开左边的直角三角形（粉色虚线），准备平移拼接。`;
    document.getElementById('formula').textContent = '';
    if (pt > 0.7 && !log.innerHTML.includes('剪开')) {
      addLog(log, '观察', `沿高剪开左侧直角三角形，准备平移到右侧`);
    }
  }
  else if (phase === 1) {
    // Left triangle sliding right
    const triMove = pt * base;

    // Remaining trapezoid
    ctx.fillStyle = 'rgba(0, 206, 201, 0.25)';
    ctx.beginPath();
    ctx.moveTo(startX + triMove, startY);
    ctx.lineTo(startX + skew + triMove, startY - height);
    ctx.lineTo(startX + skew + base, startY - height);
    ctx.lineTo(startX + base, startY);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#00cec9';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Moving triangle
    ctx.fillStyle = 'rgba(253, 121, 168, 0.3)';
    ctx.beginPath();
    ctx.moveTo(startX + triMove, startY);
    ctx.lineTo(startX + skew + triMove, startY - height);
    ctx.lineTo(startX + triMove, startY - height);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#fd79a8';
    ctx.stroke();

    // Arrow
    ctx.fillStyle = '#fd79a8';
    ctx.font = '14px PingFang SC';
    ctx.textAlign = 'center';
    ctx.fillText('← 平移 ←', startX + base/2 + skew/2, startY - height - 20);

    document.getElementById('explain').innerHTML =
      `把剪下的三角形<strong>水平平移</strong>到右边，严丝合缝地拼上。<br>` +
      `平移不改变形状和大小，<strong>总面积不变</strong>。`;
    document.getElementById('formula').textContent = '';
    if (pt > 0.5 && !log.innerHTML.includes('平移')) {
      addLog(log, '平移', '三角形水平移动到右侧，拼合成新图形');
    }
  }
  else {
    // Rectangle!
    const rx = startX + skew;
    const ry = startY - height;

    ctx.fillStyle = 'rgba(108, 92, 231, 0.25)';
    ctx.fillRect(rx, ry, base, height);
    ctx.strokeStyle = '#6c5ce7';
    ctx.lineWidth = 2;
    ctx.strokeRect(rx, ry, base, ry + height);

    // Seam
    ctx.setLineDash([4,4]);
    ctx.strokeStyle = 'rgba(253,121,168,0.35)';
    ctx.beginPath();
    ctx.moveTo(rx, ry);
    ctx.lineTo(rx, ry + height);
    ctx.stroke();
    ctx.setLineDash([]);

    // Labels
    ctx.fillStyle = '#fdcb6e';
    ctx.font = 'bold 14px PingFang SC';
    ctx.textAlign = 'center';
    ctx.fillText(`底 = ${base}`, rx + base/2, ry + height + 28);
    ctx.save();
    ctx.translate(rx - 26, ry + height/2);
    ctx.rotate(-Math.PI/2);
    ctx.fillText(`高 = ${height}`, 0, 0);
    ctx.restore();

    const area = base * height;
    ctx.fillStyle = 'rgba(0,184,148,0.9)';
    ctx.font = 'bold 14px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(`面积 = ${base} × ${height} = ${area}`, W/2, ry - 20);

    document.getElementById('explain').innerHTML =
      `拼成了一个<b>长方形</b>！<br>` +
      `长方形的长 = 平行四边形的底 = <strong>${base}</strong><br>` +
      `长方形的宽 = 平行四边形的高 = <strong>${height}</strong><br>` +
      `所以：平行四边形面积 = 底 × 高 = <strong>${area}</strong>`;
    document.getElementById('formula').textContent = 'S = 底 × 高';
    addLog(log, '完成', `平行四边形面积 = ${base} × ${height} = ${area}，割补不改变面积`);
  }
}

function redraw() {
  if (currentMode === 'rect') drawRect(Math.min(animProgress, 1));
  else if (currentMode === 'triangle') drawTriangle(Math.min(animProgress, 1));
  else drawParallelogram(Math.min(animProgress, 1));
}

function playAnim() {
  if (animId) cancelAnimationFrame(animId);
  animProgress = 0;
  const start = performance.now();
  function tick(now) {
    animProgress = Math.min((now - start) / 3500, 1);
    redraw();
    if (animProgress < 1) animId = requestAnimationFrame(tick);
  }
  animId = requestAnimationFrame(tick);
}

function resetAnim() {
  if (animId) cancelAnimationFrame(animId);
  animProgress = 0;
  redraw();
  document.getElementById('explain').textContent = '选择图形并点击播放，逐步理解面积公式的来源';
  document.getElementById('formula').textContent = '';
  const log = document.getElementById('stepLog');
  log.innerHTML = '<div class="step-entry">已重置，随时可以重新播放</div>';
}

document.querySelectorAll('.mode-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentMode = tab.dataset.mode;
    resetAnim();
  });
});

document.getElementById('playBtn').addEventListener('click', playAnim);
document.getElementById('resetBtn').addEventListener('click', resetAnim);

redraw();
</script>
</body>
</html>
